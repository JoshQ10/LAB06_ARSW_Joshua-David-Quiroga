services:
  # Backend de Blueprints con seguridad JWT (Lab 4). Por defecto se construye desde
  # el repo clonado junto a este proyecto; se puede cambiar con BACKEND_CONTEXT.
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../LAB04_ARSW_Joshua-David-Quiroga-Landazabal}
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8080" || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        VITE_USE_MOCK: 'false'
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
